# active-lens configuration (example).
#
# Copy to your config dir and edit:
#   macOS   ~/Library/Application Support/active-lens/config.toml
#
# Every value is OPTIONAL — sensible defaults apply. Run `active-lens doctor`
# to see what resolved on your machine.

[sampling]
# How often the daemon samples the activity state, in seconds.
# interval_seconds = 15

# Idle cutoff, in seconds: below this you count as "operating", at/above as
# "present" (on screen but not typing/clicking).
# active_threshold_seconds = 30

# Cap on how much an inter-sample gap credits to a state, in seconds. A gap
# larger than this means the daemon was not running (system asleep) and the
# excess is counted as "away". Defaults to interval_seconds * 3.
# max_gap_seconds = 45

[work]
# Minimum away span (minutes) counted as a work break inside a session. Shorter
# away gaps are folded into continuous work. Used by `active-lens timeline`.
# break_minutes = 10

# Away span (minutes) that ends a work session. Longer absences — a night's
# sleep, an afternoon out — separate two sessions rather than being a "break"
# inside one. Must exceed break_minutes.
# session_gap_minutes = 240

# Local hour (0-23) a logical day begins at. Activity before it is filed under
# the previous day, so an evening that runs past midnight stays on the day it
# started. Set to 0 for calendar days.
# day_start_hour = 4

[storage]
# Where raw samples are stored. Point this at an iCloud Drive / Dropbox folder
# for loose cross-device history (single-writer only — one machine's daemon).
# db_path = "~/Library/Application Support/active-lens/activity.db"
